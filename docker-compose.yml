services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: platform-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "9000:9000"
    networks:
      - platform

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    container_name: platform-hub
    restart: unless-stopped
    env_file:
      - ./apps/hub/.env
    ports:
      - "9001:9001"
    networks:
      - platform

  nginx:
    image: nginx:alpine
    container_name: platform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - hub
    networks:
      - platform

networks:
  platform:
    driver: bridge
