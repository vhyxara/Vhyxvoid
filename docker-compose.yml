version: "3.8"
services:
  hub:
    build: ./apps/hub
    command: pnpm dev
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  agent:
    build: ./apps/agent
    command: pnpm dev
    environment:
      - HUB_URL=ws://hub:9000/ws
      - AGENT_ID=agent-local-1
      - BACKEND_HOST=demo-backend
      - BACKEND_PORT=5050
    depends_on:
      - hub
      - demo-backend

  demo-backend:
    build: ./apps/demo-backend
    command: node src/index.js
    ports:
      - "5050:5050"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
