# Pinned so the project name (and so the black-server_platform network and
# image names) stays stable if the checkout directory is renamed.
name: black-server

services:
  api:
    image: ghcr.io/vhyxara/vhyxvoid-api:0095ebe
    container_name: platform-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production # ← contains PRIVATE_KEY_B64 already
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hub:
    image: ghcr.io/vhyxara/vhyxvoid-hub:0095ebe
    container_name: platform-hub
    restart: unless-stopped
    env_file:
      - ./apps/hub/.env.production
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy

  admin:
    image: ghcr.io/vhyxara/vhyxvoid-admin:latest
    container_name: platform-admin
    restart: unless-stopped
    # NEXT_PUBLIC_* are baked in at build time (see Dockerfile.next); the
    # admin API is reached same-origin through nginx at admin.vhyxvoid.com.
    networks:
      - platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: serve the marketing site + dashboard from this box too
  # (`docker compose --profile web up -d`). Otherwise host apps/web anywhere
  # that runs Next.js and point it at api.vhyxvoid.com.
  web:
    image: ghcr.io/vhyxara/vhyxvoid-web:latest
    container_name: platform-web
    restart: unless-stopped
    profiles: ["web"]
    environment:
      # Server-side rendering talks to the API over the Docker network.
      API_INTERNAL_URL: http://api:9000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - platform

  # TLS for customers' custom domains (certificates on demand). Reached only
  # through nginx (SNI router on 443, port 80 for ACME); no published ports.
  caddy:
    image: caddy:2.8-alpine
    container_name: platform-caddy
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@vhyxvoid.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - platform
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: platform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./cloudflare-allow.conf:/etc/nginx/cloudflare-allow.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      hub:
        condition: service_healthy
      admin:
        condition: service_healthy
      caddy:
        condition: service_started
    networks:
      - platform

  certbot:
    # dns-cloudflare variant: the wildcard cert renews via DNS-01, unattended.
    image: certbot/dns-cloudflare
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      # Cloudflare API token (Zone:DNS:Edit). Lives outside the repo, root-only.
      - /root/.secrets/cloudflare.ini:/etc/cloudflare.ini:ro
    networks:
      - platform

volumes:
  # Caddy's certificates and ACME account: keep across restarts (Let's
  # Encrypt rate limits).
  caddy_data:
  caddy_config:

networks:
  platform:
    driver: bridge
