# Pinned so the project name (and so the black-server_platform network and
# image names) stays stable if the checkout directory is renamed.
name: black-server

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: platform-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production # ← contains PRIVATE_KEY_B64 already
    ports:
      - "9000:9000"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    container_name: platform-hub
    restart: unless-stopped
    env_file:
      - ./apps/hub/.env.production
    ports:
      - "9001:9001"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: platform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      hub:
        condition: service_healthy
    networks:
      - platform

  certbot:
    # dns-cloudflare variant: the wildcard cert renews via DNS-01, unattended.
    image: certbot/dns-cloudflare
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      # Cloudflare API token (Zone:DNS:Edit). Lives outside the repo, root-only.
      - /root/.secrets/cloudflare.ini:/etc/cloudflare.ini:ro
    networks:
      - platform

networks:
  platform:
    driver: bridge
