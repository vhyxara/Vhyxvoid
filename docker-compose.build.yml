# Local-only override that restores the build: context for api and hub.
# Usage: docker compose -f docker-compose.yml -f docker-compose.build.yml build
# Not needed to just run the stack — docker-compose.yml alone pulls the
# published ghcr.io images.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub

  admin:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        APP: admin
        NEXT_PUBLIC_ADMIN_API_URL: https://admin.vhyxvoid.com/api/v1
        NEXT_PUBLIC_SITE_URL: https://vhyxvoid.com

  web:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        APP: web
        NEXT_PUBLIC_API_URL_LIVE: https://api.vhyxvoid.com/api/v1
