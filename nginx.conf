events {
  worker_connections 1024;
}

# ── TLS entry point: route by SNI, without decrypting ─────────────────────────
# Our own hostnames go to the HTTPS servers in the http block (127.0.0.1:8443,
# certificates from certbot). Every other hostname is a customer's custom
# domain and goes to Caddy, which gets a certificate for it on demand (only
# for domains the API reports as verified). Both receive the client address
# with the PROXY protocol, since they see this router as the TCP peer.
stream {
  map $ssl_preread_server_name $tls_upstream {
    hostnames;
    .vhyxvoid.com nginx_https; # the domain itself and every subdomain
    ""            nginx_https; # no SNI (IP access, old clients): our default
    default       caddy_https;
  }

  upstream nginx_https {
    server 127.0.0.1:8443;
  }

  upstream caddy_https {
    server caddy:443;
  }

  server {
    listen 443;
    ssl_preread on;
    proxy_pass $tls_upstream;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    # Long-lived tunnels and WebSockets: the HTTPS servers enforce their own timeouts.
    proxy_timeout 3600s;
  }
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # HTTPS connections arrive from the SNI router (stream block) with the
  # PROXY protocol; the client address comes from there. Server blocks that
  # include cloudflare-ips.conf replace this with CF-Connecting-IP.
  set_real_ip_from 127.0.0.1;
  real_ip_header proxy_protocol;

  # $from_cloudflare: 1 when the client address the SNI router saw is a
  # Cloudflare edge IP ($proxy_protocol_addr; real_ip rewrites $remote_addr).
  include /etc/nginx/cloudflare-allow.conf;

  server {
    listen 80;
    server_name vhyxvoid.com api.vhyxvoid.com hub.vhyxvoid.com admin.vhyxvoid.com *.vhyxvoid.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Customers' custom domains: Caddy answers the ACME HTTP-01 challenges for
  # their certificates and redirects everything else to HTTPS.
  server {
    listen 80 default_server;
    server_name _;

    location / {
      proxy_pass http://caddy:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }

  server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name api.vhyxvoid.com;

    # Proxied through Cloudflare: trust its edge IPs to supply the real client IP.
    include /etc/nginx/cloudflare-ips.conf;

    # Origin lock: only Cloudflare may reach this host, so direct-to-origin
    # requests (with a forged Host) can't bypass the edge. The wildcard tunnel
    # block below is deliberately NOT locked - agents/clients hit it directly.
    if ($from_cloudflare = 0) {
      return 403;
    }

    ssl_certificate /etc/letsencrypt/live/api.vhyxvoid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vhyxvoid.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The admin API is only served through admin.vhyxvoid.com (behind
    # Cloudflare Access), never on the public API host.
    location /api/v1/admin/ { return 404; }

    # Team space live updates (WebSocket): upgrade, and keep idle sockets
    # open (the API pings every minute).
    location = /api/v1/team/ws {
      proxy_pass http://api:9000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location / {
      proxy_pass http://api:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name hub.vhyxvoid.com;

    # Proxied through Cloudflare: trust its edge IPs to supply the real client IP.
    include /etc/nginx/cloudflare-ips.conf;

    # Origin lock: only Cloudflare may reach this host, so direct-to-origin
    # requests (with a forged Host) can't bypass the edge. The wildcard tunnel
    # block below is deliberately NOT locked - agents/clients hit it directly.
    if ($from_cloudflare = 0) {
      return 403;
    }

    ssl_certificate /etc/letsencrypt/live/api.vhyxvoid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vhyxvoid.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Admin-only hub endpoints are reached by the api container over the
    # Docker network (http://hub:9001/internal/...), never from the internet.
    # /metrics stays internal too (scrape it from inside the network).
    location /internal/ { return 404; }
    location = /metrics { return 404; }

    location / {
      proxy_pass http://hub:9001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_cache off;
      tcp_nodelay on;
      proxy_socket_keepalive on;
      keepalive_timeout 3600s;
    }
  }

  # Operations console. Gate this host with Cloudflare Access (or an IP
  # allow-list); admin login is the second factor, not the only one.
  # The admin API is proxied same-origin so the refresh cookie stays
  # first-party and no CORS is involved.
  server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name admin.vhyxvoid.com;

    include /etc/nginx/cloudflare-ips.conf;
    if ($from_cloudflare = 0) {
      return 403;
    }

    ssl_certificate /etc/letsencrypt/live/vhyxvoid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vhyxvoid.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/v1/admin/ {
      proxy_pass http://api:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else on the API stays on api.vhyxvoid.com.
    location /api/ { return 404; }

    location / {
      proxy_pass http://admin:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name *.vhyxvoid.com;

    ssl_certificate /etc/letsencrypt/live/vhyxvoid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vhyxvoid.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    # Tunnel request bodies: match the hub's MAX_BODY_BYTES and the
    # protocol's LIMITS.MAX_PAYLOAD_BYTES (both 10 MiB). nginx's 1 MB default
    # made anything larger fail with nginx's own 413 page before the hub
    # could apply its limit (audit H6). The api block keeps the default,
    # which already equals Fastify's own 1 MiB bodyLimit.
    client_max_body_size 10m;

    location / {
      proxy_pass http://hub:9001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Overwrite, don't append: tunnel hosts are DNS-only (no Cloudflare in
      # front), so $remote_addr is the real client (from the SNI router's
      # PROXY protocol, see the http-level real_ip settings), and
      # $proxy_add_x_forwarded_for would let a caller prepend any IP that a
      # backend trusting the left-most entry would believe (audit part2
      # G14). Trustworthy for backends: X-Real-IP and X-Forwarded-For (both
      # the client IP as nginx saw it), X-Forwarded-Proto.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off; 
    }
  }
}
