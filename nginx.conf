events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name api.vhyxvoid.com hub.vhyxvoid.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name api.vhyxvoid.com;

    ssl_certificate /etc/letsencrypt/live/api.vhyxvoid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vhyxvoid.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://api:9000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    server_name hub.vhyxvoid.com;

    ssl_certificate /etc/letsencrypt/live/api.vhyxvoid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vhyxvoid.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://hub:9001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
