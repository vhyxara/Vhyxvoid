name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Every workspace installs from npm and this repo alone: apps/web and
      # apps/admin use the published @vhyxui/* packages and the in-repo
      # @vhyxvoid/api-kit (they used to link sibling checkouts and were
      # excluded here).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Test (api, hub, packages)
        run: pnpm test

      - name: Test (api-kit, web, admin)
        run: pnpm test:apps

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, file: Dockerfile.api, args: "" }
          - { name: hub, file: Dockerfile.hub, args: "" }
          - { name: web, file: Dockerfile.next, args: "APP=web" }
          - { name: admin, file: Dockerfile.next, args: "APP=admin" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push): proves every image still builds from this repo.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
